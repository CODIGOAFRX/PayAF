# Configuración común a todos los perfiles
spring:
  application:
    name: payaf
  profiles:
    # Sin perfil explícito se arranca en memoria, sin base de datos
    default: memory

server:
  port: 8080

payaf:
  # Circuit breaker de cada pasarela: se abre con 3 fallos técnicos seguidos y vuelve a
  # probar pasados 15 s
  breaker:
    failure-threshold: 3
    open-duration: 15s
  # Reaper de pagos huérfanos (cada 30 s, PENDING de más de 2 min)
  reaper:
    enabled: true
  # Relay del outbox (cada 500 ms) en los dos perfiles
  outbox:
    relay:
      enabled: true
  # Demo pública: como mucho N pagos (POST /api/payments) por minuto y por IP; si no, 429 RATE_LIMITED
  demo:
    payments-per-minute: 30
  # Las PSP simuladas mandan webhooks firmados tras capturar y reembolsar
  sim:
    webhooks:
      enabled: true
  # Secretos de los webhooks (los mismos para firmar en el simulador y verificar en /webhooks)
  webhooks:
    secrets:
      stripe: ${PAYAF_STRIPE_WEBHOOK_SECRET:whsec_payaf_demo}
      adyen: ${PAYAF_ADYEN_HMAC_KEY:adyen_payaf_demo}
      redsys: ${PAYAF_REDSYS_SECRET:redsys_payaf_demo}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

---
# Perfil memory: persistencia en memoria. Se desactiva toda la autoconfiguración
# de base de datos para que la aplicación arranque sin PostgreSQL.
spring:
  config:
    activate:
      on-profile: memory
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.jdbc.autoconfigure.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration
      - org.springframework.boot.data.jpa.autoconfigure.DataJpaRepositoriesAutoConfiguration
      - org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration

---
# Perfil postgres: PostgreSQL local (docker compose) o remoto mediante variables de entorno.
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${PAYAF_DB_URL:jdbc:postgresql://localhost:5433/payaf}
    username: ${PAYAF_DB_USER:payaf}
    password: ${PAYAF_DB_PASSWORD:payaf}
    hikari:
      # Neon free tiene pocas conexiones: un pool pequeño basta para la demo
      maximum-pool-size: ${PAYAF_DB_POOL:5}
  jpa:
    open-in-view: false
    hibernate:
      # El esquema lo gestiona Flyway; Hibernate solo lo valida
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
