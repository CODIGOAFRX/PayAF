# PostgreSQL local para el perfil postgres de PayAF
services:
  postgres:
    image: postgres:17
    container_name: payaf-postgres
    environment:
      POSTGRES_DB: payaf
      POSTGRES_USER: payaf
      POSTGRES_PASSWORD: payaf
    ports:
      - "5433:5432"
    volumes:
      - payaf-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payaf -d payaf"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  payaf-pgdata:
